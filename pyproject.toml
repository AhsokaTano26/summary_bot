[project]
name = "summary_bot"
version = "0.1.0"
description = "summary_bot"
readme = "README.md"
requires-python = ">=3.9, <4.0"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = [
    "nonebot_plugin_apscheduler",
    "summary_bot",
    "detect"
]
plugin_dirs = ["src/plugins"]
builtin_plugins = []
